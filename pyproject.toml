[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "totalsegmentator-wrapper-mac"
version = "0.4.1"
description = "Non-clinical Apple Silicon/MPS preview runner for dental-relevant segmentation."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "TotalSegmentator Wrapper for Mac contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "nibabel>=5.2",
  "numpy>=1.26,<3",
  "scikit-image>=0.22",
]

[project.urls]
Homepage = "https://totalsegmentator.lacramy.com/"
Documentation = "https://github.com/ainem-m/segmentation_w_mps/blob/master/docs/USER_MANUAL_JA.md"
Repository = "https://github.com/ainem-m/segmentation_w_mps"
Issues = "https://github.com/ainem-m/segmentation_w_mps/issues"

[project.optional-dependencies]
dicom = [
  "pydicom>=3,<4",
]
mps = [
  "torch>=2.3",
  "totalsegmentator==2.14.0",
]
dentalseg = [
  "nnunetv2>=2.8.1,<2.9",
]
toothseg = [
  "nnunetv2>=2.8.1,<2.9",
  "acvl-utils>=0.2.6,<0.3",
  "scipy>=1.14,<2",
]
ios-meshsegnet = [
  "torch>=2.3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "trimesh>=4.6,<5",
  "fast-simplification>=0.1.13,<0.2",
  "fpsample==1.0.2",
  "open3d>=0.19,<0.20",
  "matplotlib>=3.9,<4",
]
dev = [
  "build>=1.2",
]

[project.scripts]
totalsegmentator-wrapper-mac = "totalsegmentator_wrapper_mac.cli:main"
totalsegmentator-wrapper-coordinator = "totalsegmentator_wrapper_mac.coordinator:main"
ios-meshsegnet = "totalsegmentator_wrapper_mac.ios_meshsegnet:main"
ios-model-dispatch = "totalsegmentator_wrapper_mac.ios_model_dispatch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
totalsegmentator_wrapper_mac = [
  "bin/totalsegmentator-wrapper-dicom-normalizer",
  "licenses/*.txt",
  "licenses/*.json",
  "totalseg_setup_weights_manifest.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
