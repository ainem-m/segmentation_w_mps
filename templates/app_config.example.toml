[app]
name = "TotalSegmentator Wrapper for Mac"
version = "0.1.0-preview"
non_clinical_notice = true

[paths]
app_support_dir = "~/Library/Application Support/TotalSegmentatorWrapperMac"

[backend]
default_engine = "totalsegmentator"
default_task = "craniofacial_structures"
default_device = "auto"
precision = "fp32"

[features]
dicom_input = false
stl_export = true
surface_preview = true
benchmark = true
