name: 改善を提案
description: 操作画面、マニュアル、対応機能の改善案
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どの操作で迷うか、現在どのように対応しているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望する改善
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 個人情報の確認
      options:
        - label: 患者情報、DICOM、CT画像を含めていません
          required: true
